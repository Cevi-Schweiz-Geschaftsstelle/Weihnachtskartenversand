<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anleitung – Weihnachtsbrief-Versand</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--line2:#eef0f3;--text:#1d232b;--muted:#66707c;--accent:#0f6e64;--accent-soft:#e3f2ef;--accent-ink:#0b5149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;color:var(--text);text-decoration:none;cursor:pointer}
.btn:hover{border-color:#b9c6d6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:940px;margin:0 auto;padding:24px 22px 60px}
.toc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:26px}
.toc b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.toc ol{margin:6px 0 0;padding-left:22px;columns:2;column-gap:28px}
.toc a{color:var(--accent-ink);text-decoration:none} .toc a:hover{text-decoration:underline}
h2{font-size:21px;margin:34px 0 8px;padding-top:6px;border-top:1px solid var(--line);scroll-margin-top:70px}
h2:first-of-type{border-top:0;margin-top:0}
p{margin:8px 0}
ul,ol{margin:6px 0 10px;padding-left:24px} li{margin:3px 0}
a{color:var(--accent-ink)}
table{border-collapse:collapse;width:100%;margin:10px 0 14px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line2)}
th{background:#fafbfc;color:var(--muted);font-size:13px}
p.cap{color:var(--muted);font-size:13.5px;margin:14px 0 4px}
figure{margin:0 0 18px}
figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff}
@media (max-width:700px){.toc ol{columns:1}}
@media print{
  header .btn{display:none} header{position:static;border:0;padding:0 0 8px}
  body{background:#fff;font-size:11.5pt} main{max-width:none;padding:0}
  .toc{break-after:page} h2{break-before:page;border-top:0} figure,table,p.cap{break-inside:avoid}
  figure img{box-shadow:none} a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header>
  <div><h1>Anleitung – Weihnachtsbrief-Versand</h1><div class="sub">für Nutzer*innen · Stand 26.11.2026</div></div>
  <div class="sp"></div>
  <button class="btn" onclick="window.print()" title="Drucken oder im Druckfenster „Als PDF sichern“ wählen">🖨 Drucken / als PDF</button>
  <a class="btn primary" href="index.html">← zum Tool</a>
</header>
<main>
  <nav class="toc"><b>Inhalt</b><ol><!--TOC--></ol></nav>
<!--INHALT-->
</main>
</body>
</html>
