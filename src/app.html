<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weihnachtsbrief-Versand – Adress-Tool</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --line2:#eef0f3; --text:#1d232b; --muted:#66707c; --soft:#8a939e;
  --accent:#0f6e64; --accent-soft:#e3f2ef; --accent-ink:#0b5149;
  --warn:#b45309; --warn-soft:#fdf3e1; --bad:#b42318; --bad-soft:#fde8e6; --info:#2a5db0; --info-soft:#e7eefb;
  --ok:#17803d; --ok-soft:#e5f5ea; --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px 0}
.titlebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.titlebar h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.titlebar .sub{color:var(--muted);font-size:13px}
.titlebar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef0f2}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.menuwrap{position:relative}
#btnMenu.on{background:#eef0f2}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(16,24,40,.18);padding:6px}
.menu .mh{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:8px 10px 3px}
.menu .mi{display:flex;width:100%;gap:8px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:13.5px;cursor:pointer;color:var(--text)}
.menu .mi:hover{background:#f1f3f5}
.menu .mi:disabled{opacity:.55;cursor:default}
.menu .mi.danger{color:var(--bad)} .menu .mi.danger:hover{background:var(--bad-soft)}
.menu label.mi input{margin-top:3px}
.menu .msep{height:1px;background:var(--line2);margin:6px 4px}
.menu .mnote{font-size:12px;color:var(--muted);padding:0 10px 6px}
.kpis{display:flex;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.kpi{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;min-width:132px}
.kpi .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)}
.kpi .bar{height:4px;background:#e6e8eb;border-radius:3px;margin-top:5px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--ok)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:560}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:9px;background:#eceef1;font-size:11.5px;color:var(--muted)}
nav.tabs .count.warn{background:var(--warn-soft);color:var(--warn)}
main{flex:1;padding:18px 22px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel>.hd{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>.hd h2,.panel>.hd h3{margin:0;font-size:15.5px;font-weight:640}
.panel>.bd{padding:14px 16px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.catcol{max-width:1180px}
.grid2.resp{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
.grid2.resp.wl{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
@media (max-width:1100px){.grid2,.grid2.resp.wl{grid-template-columns:1fr}}
/* Zuständigkeiten */
.split{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.owners{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.owners .search{padding:10px}
.owners input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.owner{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-top:1px solid var(--line2);cursor:pointer}
.owner:hover{background:#f7f8fa}
.owner.on{background:var(--accent-soft)}
.owner.all{border-bottom:2px solid var(--line)}
tr.hiddenrow td{opacity:.45} tr.hiddenrow td.hidecol{opacity:1}
tr.hiddenrow .name{text-decoration:line-through}
td.hidecol{white-space:nowrap;text-align:right;width:1%}
.owner .n{font-weight:600;display:flex;gap:6px;align-items:baseline}
.owner .n .code{font-variant:all-small-caps;letter-spacing:.04em;color:var(--accent-ink)}
.owner .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-top:2px}
.owner .prog{height:3px;background:#e8eaed;border-radius:2px;margin-top:6px;overflow:hidden}
.owner .prog i{display:block;height:100%;background:var(--ok)}
.owner.warn .n{color:var(--warn)}
.owners .sep{padding:10px 12px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);border-top:1px solid var(--line2)}
/* Tabellen */
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0;z-index:1;white-space:nowrap}
tr:hover td{background:#fbfcfd}
tr.done td{color:var(--soft)}
tr.done td .name{text-decoration:line-through}
td .name{font-weight:600}
td .org{color:var(--muted);font-size:12.5px}
td.addr{font-size:13px;white-space:nowrap}
td.chk{width:34px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:#eef0f3;font-size:12px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.cat{background:var(--info-soft);color:#21477f}
.chip.co{background:var(--warn-soft);color:#8a4108;font-weight:600}
.chip.db{background:var(--ok-soft);color:#14612f}
.chip.dup{background:#f1e8fb;color:#5b2d91}
.chip.prim{outline:1.5px solid #9db6e0}
.note{display:block;font-size:12px;color:var(--warn);margin-top:2px}
.note.bad{color:var(--bad)}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.section-title h3{margin:0;font-size:14.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
select.inline{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fff;max-width:220px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:240px}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters label{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
/* Drop */
.drop{border:2px dashed #c9ced6;border-radius:14px;padding:40px 20px;text-align:center;background:#fff;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0 0 6px;font-size:18px}
.dropmask{position:fixed;inset:0;background:rgba(15,110,100,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;z-index:50;font-size:22px;font-weight:650;color:var(--accent-ink)}
.dropmask.show{display:flex}
/* Duplikate */
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2)}
.pair .who{background:#fafbfc;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.pair .acts{display:flex;flex-direction:column;gap:6px}
.why{font-size:12px;color:var(--muted);margin-bottom:4px}
/* Einstellungen */
.catlist{list-style:none;margin:0;padding:0}
.catlist li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line2)}
.catlist li:first-child{border-top:0}
input.cell{border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent}
input.cell:hover{border-color:var(--line)} input.cell:focus{border-color:var(--accent);background:#fff;outline:none}
.catlist input.catname{font-weight:650;font-size:14px;padding:2px 6px;width:auto;min-width:220px;border-color:transparent;background:transparent}
.catlist input.catname:hover{border-color:var(--line)} .catlist input.catname:focus{border-color:var(--accent);background:#fff}
.chip.pers{background:#fff;border:1px solid var(--line);padding:3px 4px 3px 8px;font-size:12.5px}
.chip.pers .code{font-variant:all-small-caps;letter-spacing:.04em;color:var(--accent-ink);font-weight:650}
.chip.pers.unknown{border-style:dashed;border-color:#d9a54b;background:var(--warn-soft)}
.lnk{border:0;background:transparent;cursor:pointer;color:var(--accent);padding:0 3px;font-size:12px}
.lnk.x{color:var(--soft)} .lnk.x:hover{color:var(--bad)}
.cand.sugg{min-width:0}
details.grp>summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none;padding:3px 0}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--soft);width:10px}
details.grp[open]>summary::before{content:'▾'}
details.grp>summary .ttl{font-weight:650;font-size:14px}
details.grp>summary:hover .ttl{color:var(--accent)}
details.grp>summary .miss{color:var(--warn);font-weight:500}
.mform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mform input,.mform select{flex:1 1 150px;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px}
.mform .w2{flex:2 1 220px} .mform .wzip{flex:0 0 90px}
.mform .btn{flex:0 0 auto}
details.mlist{margin-top:12px} details.mlist>summary{cursor:pointer;padding:4px 0}
.catmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.catlist .mv{opacity:.35} .catlist li:hover .mv,.catlist .mv:focus-within{opacity:1}
details.grp .grpbody{margin-top:8px;border:1px solid var(--line2);border-radius:10px;padding:6px 12px 8px;background:#fbfcfd}
.catlist li.fromdb{background:#eaf7ee;border-radius:10px;border-top-color:transparent;padding:10px 8px;margin-top:6px}
.catlist li.fromdb+li{border-top-color:transparent}
.catlist li.fromdb .catname{background:transparent}
.badge.db{background:#cdebd7;color:#145c33;white-space:nowrap}
.legend-db{display:inline-block;width:14px;height:14px;border-radius:4px;background:#eaf7ee;border:1px solid #cdebd7;vertical-align:-2px;margin-right:4px}
.catlist li.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{background:#fff6d6}100%{background:transparent}}
details.subs{margin-top:10px;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;background:#fbfcfd}
details.subs>summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
details.subs>summary::-webkit-details-marker{display:none}
details.subs>summary::before{content:'▸';color:var(--soft)} details.subs[open]>summary::before{content:'▾'}
table.subtab{width:100%;margin-top:6px} table.subtab td{border-bottom:1px solid var(--line2);padding:7px 6px;vertical-align:top}
table.subtab tr:last-child td{border-bottom:0}
table.subtab .sub-x{margin-left:auto;opacity:.5;white-space:nowrap} table.subtab tr:hover .sub-x{opacity:1}
table.subtab td.sgname{width:32%;padding-top:9px}
table.subtab select.inline{max-width:118px;font-size:12.5px;padding:2px 6px}
table.subtab .chip.pers{font-size:12px;padding:2px 3px 2px 7px}
.chk-row.sub{padding-left:34px;background:#fcfdfd} .chk-row.sub .nm{font-weight:450}
.chip.cat.sub{background:#eef3fb}
table.dbmap tr.off td{color:var(--soft)} table.dbmap tr.hdr td{background:#fafbfc}
.dbcol{max-width:1100px}
#btnCloud.cloud-ok{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
#btnCloud.cloud-err{border-color:#e6b366;color:var(--warn);background:var(--warn-soft)}
.modal-back{position:fixed;inset:0;background:rgba(17,24,39,.38);display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:6vh 16px;overflow:auto}
.modal-back[hidden]{display:none}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%)}
.modal .hd{padding:16px 18px 6px} .modal .hd h3{margin:0;font-size:16px}
.modal .bd{padding:6px 18px 4px}
.modal .ft{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2);margin-top:8px}
.checklist{display:flex;flex-direction:column;max-height:56vh;overflow:auto;border:1px solid var(--line2);border-radius:10px}
.chk-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line2);cursor:pointer}
.chk-row:first-child{border-top:0}
.chk-row:hover{background:#f7faf9}
.chk-row:has(input:checked){background:var(--accent-soft)}
.chk-row .nm{font-weight:560}
.chip.cat .lnk.x{margin-left:2px;padding:0 2px}
.sugg-wrap{position:relative;display:inline-flex}
.sugg-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--soft);font-size:10px;line-height:1;cursor:pointer;padding:0;z-index:1}
.sugg-x:hover{color:var(--bad);border-color:var(--bad)}
.cand.sugg .who::before{content:none!important}
.cand .code{font-variant:all-small-caps;letter-spacing:.04em;color:var(--accent-ink)}
details.panel>summary{list-style:none} details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h3::before{content:'▸ ';color:var(--soft)} details.panel[open]>summary h3::before{content:'▾ '}
.catlist li .rank{color:var(--soft);font-variant-numeric:tabular-nums;text-align:right;padding-top:4px}
.catlist input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px}
.form{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;align-items:center}
.form input[type=text],.form input[type=password],.form input[type=url],textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
textarea{min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.callout{border-radius:10px;padding:12px 14px;background:var(--info-soft);color:#1f3f73;font-size:13px}
.callout.warn{background:var(--warn-soft);color:#7a3c07}
.callout h4{margin:0 0 4px;font-size:13.5px}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f1720;color:#d8e1ea;border-radius:8px;padding:10px 12px;max-height:220px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;right:18px;bottom:18px;background:#1d232b;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:60;max-width:440px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.notes-fade{animation:notesFade 10s linear forwards}
@keyframes notesFade{0%,80%{opacity:1}100%{opacity:0}}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#eef0f3;border-radius:4px;padding:0 5px}
.right{margin-left:auto}
.cands{display:flex;flex-wrap:wrap;gap:6px}
.cand{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;text-align:left;cursor:pointer;min-width:150px;max-width:300px}
.cand:hover{border-color:#9fc9c1;background:#f6fbfa}
.cand .who{font-weight:600;display:flex;gap:6px;align-items:center}
.cand .via{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.cand.on{border-color:var(--accent);background:var(--accent-soft)}
.cand.on .who::before{content:'●';color:var(--accent)}
.cand:not(.on) .who::before{content:'○';color:#b5bcc5}
.cand.self{opacity:.55}
.cand .sug{font-size:10.5px;font-weight:600;color:var(--info);background:var(--info-soft);border-radius:5px;padding:0 5px}
.free{display:flex;gap:6px;align-items:center;margin-top:8px}
.free input{padding:5px 9px;border:1px solid var(--line);border-radius:7px;min-width:290px}
tr.decided td{background:#fbfdfc}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.chip.new{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.gone{background:var(--bad-soft);color:var(--bad);font-weight:600}
.change{border-color:#b9d7d1}
.change .hd{background:var(--accent-soft);border-radius:var(--radius) var(--radius) 0 0}
.change details{border-top:1px solid var(--line2);padding:8px 0}
.change details:first-of-type{border-top:0}
.change summary{cursor:pointer}
.change ul{margin:6px 0 2px 18px;padding:0;columns:2;column-gap:28px}
.change li{break-inside:avoid;margin-bottom:3px;font-size:13px}
@media (max-width:1000px){.change ul{columns:1}}
.hide{display:none!important}
/* Etiketten */
.modal.wide{width:min(980px,100%)}
#ngModal .modal{width:min(720px,100%)}
table.ngtab{width:100%;border-collapse:collapse} table.ngtab td{padding:8px 4px;border-top:1px solid var(--line2);vertical-align:top} table.ngtab select{max-width:330px}
.lbl-grid{display:grid;grid-template-columns:300px 1fr;gap:20px}
@media (max-width:860px){.lbl-grid{grid-template-columns:1fr}}
.lbl-form{display:grid;grid-template-columns:1fr;gap:10px}
.lbl-form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.lbl-form select,.lbl-form input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.lbl-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl-custom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lbl-custom input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.lbl-preview-wrap{background:#eceff3;border-radius:10px;padding:14px;display:flex;justify-content:center;overflow:auto;max-height:62vh}
.lbl-preview{transform-origin:top left}
#labelsPrint{display:none}
.lsheet{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;page-break-after:always;break-after:page}
.lsheet:last-child{page-break-after:auto;break-after:auto}
.lcell{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden;color:#000;font-family:Arial,Helvetica,sans-serif;line-height:1.22}
.lcell div{overflow-wrap:anywhere}
.lcell.framed,.lbl-preview .lcell{outline:0.2mm dashed #9aa3ad;outline-offset:-0.2mm}
.lcell.empty{background:repeating-linear-gradient(45deg,#f3f4f6 0 2mm,#fff 2mm 4mm)}
#labelsPrint .lcell.empty{background:none}
body.print-labels #labelsPrint{display:block}
@media print{
  body.print-labels > *:not(#labelsPrint){display:none!important}
  body.print-labels{background:#fff}
  header.top,.owners,.noprint,.toast,nav.tabs{display:none!important}
  main{padding:0}
  .split{display:block}

<script>
'use strict';
const STORE_KEY = 'weihnachtsbrief-tool-v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------------------------------------------------------------- Zustand
function defaultState() {
  return {
    sources: [],
    cats: WB.DEFAULT_CATEGORIES.map(c => ({ ...c })),
    order: WB.DEFAULT_CATEGORIES.map(c => c.id),
    staff: [],
    aliasText: '', autoAliases: true, version: 8,
    decisions: {}, overrides: {}, done: {}, hidden: {}, importDone: true,
    db: { baseUrl: 'https://db.cevi.ch', token: '', rememberToken: false, lastRefresh: null, groupExclude: 'Ehemalige\nArchiv\nNorwegen Lager 2025\nESG LTS 2025', groupFilter: 'Geschäftsstelle\nAusschüsse\nFachgruppen\nProjektgruppen\nKommissionen\nKrisenmanagement › Cevi CH\nEhrenmitglieder\nPSA',
          sources: [] },
    m365: { tenantId: '', clientId: '', siteUrl: '', folder: 'Weihnachtsbrief-Tool', enabled: false, linked: false },
    ui: { tab: 'settings', owner: null, filter: { q: '', cat: '', owner: '', only: '' }, assignFilter: 'open' },
  };
}
let S = load();
let sessionToken = '';
let R = { people: [], review: [], entries: [], aliases: { codeNames: {}, labelToCode: {} }, byOwner: new Map(), coByOwner: new Map(), hiddenByOwner: new Map(), active: [] };

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    s.ui = Object.assign(defaultState().ui, s.ui || {});
    s.db = Object.assign(defaultState().db, s.db || {});
    // neue Standard-Kategorien ergänzen
    for (const c of WB.DEFAULT_CATEGORIES) {
      const ex = s.cats.find(x => x.id === c.id);
      if (!ex) { s.cats.push({ ...c }); s.order.push(c.id); }
      else { ex.exact = c.exact; ex.strong = c.strong; ex.weak = c.weak; }
    }
    if (!s.version || s.version < 3) {
      // Version 3: Personenliste „Zuständige" + mehrere Personen pro Kategorie
      s.staff = Array.isArray(s.staff) ? s.staff : [];
      for (const line of (s.aliasText || '').split('\n')) {
        const m = line.trim().match(/^([A-Za-zÄÖÜ]{2,4})\s*:\s*(.+)$/);
        if (m && !s.staff.some(x => (x.code || '').toUpperCase() === m[1].toUpperCase())) s.staff.push({ id: uid(), code: m[1].toUpperCase(), name: m[2].trim(), aliases: [] });
      }
      for (const c of s.cats) {
        if (!Array.isArray(c.persons)) c.persons = WB.catPersonLabels(c);
        if (c.ownerManual) c.personsManual = true;
        delete c.owner; delete c.ownerManual;
      }
      s.aliasText = '';
      s.version = 3;
    }
    if (s.version < 4) {
      // Version 4: Kategorie „Kindeswohl" heisst „PSA" (nur wenn nicht von Hand umbenannt); Untergruppen-Schlüssel nachführen
      const k = s.cats.find(c => c.id === 'kindeswohl');
      if (k && k.name === 'Kindeswohl') {
        k.name = 'PSA';
        if (k.groups) { const g2 = {}; for (const [gk, g] of Object.entries(k.groups)) { const nk = WB.groupKey('PSA', g.name || gk) || gk; g2[nk] = g; } k.groups = g2; }
      }
      s.version = 4;
    }
    if (s.version < 5) {
      // Version 5: Krisenmanagement nur Untergruppe „Cevi CH"
      if (s.db && typeof s.db.groupFilter === 'string') s.db.groupFilter = s.db.groupFilter.replace(/^\s*Krisenmanagement\s*$/m, 'Krisenmanagement › Cevi CH');
      s.version = 5;
    }
    if (s.version < 6) {
      // Version 6: abgeschlossene Projektgruppen und Archiv ausschliessen; alte Untergruppen ausserhalb von „Gruppe › Untergruppe" aufräumen
      if (s.db && typeof s.db.groupExclude === 'string') {
        const have = s.db.groupExclude.split(/\n+/).map(exclNorm).filter(Boolean);
        const add = ['Archiv', 'Norwegen Lager 2025', 'ESG LTS 2025'].filter(t => !have.some(h => exclNorm(t).includes(h)));
        if (add.length) s.db.groupExclude = [s.db.groupExclude.trim(), ...add].filter(Boolean).join('\n');
      }
      s._pruneV6 = true;
      s.version = 6;
    }
    if (s.version < 7) {
      // Version 7: MIO nicht mehr aus der Cevi DB (Kategorie bleibt für Excel und von Hand); PSA nur oberste Ebene
      if (s.db && typeof s.db.groupFilter === 'string') s.db.groupFilter = s.db.groupFilter.split('\n').filter(l => !/mitgliederorganisation|\bmio\b/i.test(l)).join('\n');
      if (s.db && Array.isArray(s.db.sources)) {
        const orgIds = s.db.sources.filter(x => x.mode === 'orgs').map(x => 'db:' + x.id);
        s.db.sources = s.db.sources.filter(x => x.mode !== 'orgs');
        s.sources = (s.sources || []).filter(x => !orgIds.includes(x.id));
        for (const x of s.db.sources) if (x.catId === 'kindeswohl' || /\bpsa\b/i.test(x.label || '')) {
          x.subgroups = false; x.noSubs = true;
          const roots = String(x.groupIds || '').split(/[\s,;]+/).filter(Boolean);
          const loaded = (s.sources || []).find(y => y.id === 'db:' + x.id);
          if (loaded) loaded.entries = loaded.entries.filter(e => !e.groupId || roots.includes(String(e.groupId)));
        }
      }
      const psa = (s.cats || []).find(c => c.id === 'kindeswohl');
      if (psa && psa.groups) for (const [gk, g] of Object.entries(psa.groups)) if (g.fromDb && !g.manual && !(g.persons || []).length) delete psa.groups[gk];
      s.version = 7;
    }
    if (s.version < 8) {
      // Version 8: „Anlässe des Jahres" ist eine Untergruppe von „Diverse"; Conveniat nur oberste Ebene
      const old = (s.cats || []).find(c => c.id === 'anlaesse'), div = (s.cats || []).find(c => c.id === 'diverse');
      if (old && div) {
        const GN = 'Anlässe des Jahres', gk = WB.groupKey(div.name, GN);
        div.groups = div.groups || {};
        const g = div.groups[gk] || (div.groups[gk] = { name: GN, persons: [], manual: true });
        if (!(g.persons || []).length && (old.persons || []).length) g.persons = old.persons.slice();
        for (const src of s.sources || []) {
          if (src.catId === 'anlaesse') { src.catId = 'diverse'; for (const e of src.entries || []) { e.catId = 'diverse'; e.group = GN; } }
          else if (src.perRow) for (const e of src.entries || []) if (e.catId === 'anlaesse') { e.catId = 'diverse'; e.group = GN; }
        }
        for (const x of (s.db && s.db.sources) || []) if (x.catId === 'anlaesse') x.catId = 'diverse';
      }
      s.cats = (s.cats || []).filter(c => c.id !== 'anlaesse'); s.order = (s.order || []).filter(id => id !== 'anlaesse');
      const pg = (s.cats || []).find(c => c.id === 'projektgruppen'), conv = /conv[eéi]niat/i;
      if (pg && pg.groups) for (const [gk, g] of Object.entries(pg.groups)) {
        const par = g.parentGk && pg.groups[g.parentGk];
        if (g.fromDb && conv.test(g.name || '') && !(par && conv.test(par.name || ''))) markLeaf(pg, gk);
      }
      s.version = 8;
    }
    s.staff = s.staff || [];
    s.sources = (s.sources || []).filter(x => !x.demo); // frühere „Demo ohne Verbindung"-Daten
    s.notes = []; // Import-Hinweise werden nur noch kurz angezeigt
    s.m365 = Object.assign({ tenantId: '', clientId: '', siteUrl: '', folder: 'Weihnachtsbrief-Tool', enabled: false, linked: false }, s.m365 || {});
    if (s.db.groupFilter === undefined) s.db.groupFilter = 'Geschäftsstelle\nAusschüsse\nFachgruppen\nProjektgruppen\nKommissionen\nKrisenmanagement › Cevi CH\nEhrenmitglieder\nPSA';
    if (s.db.groupExclude === undefined) s.db.groupExclude = 'Ehemalige\nArchiv\nNorwegen Lager 2025\nESG LTS 2025';
    // alter, nie ausgefüllter Beispiel-Eintrag
    s.db.sources = (s.db.sources || []).filter(x => !(x.label === 'Fachgruppen' && !String(x.groupIds || '').trim() && !x.auto));
    for (const st of s.staff) if (st.first === undefined && st.last === undefined) Object.assign(st, splitName(st.name));
    return s;
  } catch (e) { console.warn(e); return defaultState(); }
}
/** Untergruppe „nur diese Ebene": alle ihre Untergruppen entfernen (Liste „Entfernt") und künftig nicht mehr laden */
function markLeaf(c, gk) {
  const G = c.groups || {}; if (!G[gk]) return 0;
  G[gk].leaf = true;
  const isDesc = (x) => { let cur = G[x] && G[x].parentGk, k = 0; while (cur && k++ < 30) { if (cur === gk) return true; cur = G[cur] && G[cur].parentGk; } return false; };
  let n = 0; for (const x of Object.keys(G)) if (x !== gk && isDesc(x) && !G[x].removed) { G[x].removed = true; n++; }
  return n;
}
function save(fromSync) {
  const copy = { ...S, db: { ...S.db } };
  if (!S.db.rememberToken) copy.db.token = '';
  try { localStorage.setItem(STORE_KEY, JSON.stringify(copy)); }
  catch (e) { toast('Konnte nicht lokal speichern: ' + e.message); }
  if (!fromSync && typeof Cloud !== 'undefined' && Cloud.status === 'ok') Cloud.schedulePush();
}
let CLOUD_KEY = ''; // API-Key aus dem geschützten SharePoint-Ordner – nur im Speicher, nie lokal oder im gemeinsamen Stand
function manualToken() { return S.db.rememberToken ? S.db.token : sessionToken; }
function token() { return manualToken() || CLOUD_KEY; }

// ---------------------------------------------------------------- Berechnung
const staffKey = (st) => String((st && (st.code || st.name)) || '').trim();
const fullName = (first, last) => [first, last].map(x => String(x || '').trim()).filter(Boolean).join(' ');
function splitName(name) { const t = String(name || '').trim().replace(/\s+/g, ' '); const i = t.indexOf(' '); return i < 0 ? { first: t, last: '' } : { first: t.slice(0, i), last: t.slice(i + 1) }; }
/** Kürzel automatisch: 1. Buchstabe Vorname + 1./2. Buchstabe Nachname; falls vergeben, nächste Variante */
function autoCode(first, last, except) {
  const taken = (c) => S.staff.some(x => x !== except && x.code === c);
  for (const c of WB.codeVariants(first, last)) if (!taken(c)) return c;
  const base = WB.makeCode(first, last); if (!base) return '';
  for (let n = 2; n < 100; n++) if (!taken(base + n)) return base + n;
  return '';
}
function parseAliasText() {
  const map = new Map(), names = {};
  for (const line of (S.aliasText || '').split('\n')) {
    const l = line.trim(); if (!l || l.startsWith('#')) continue;
    let m = l.match(/^(.+?)\s*=\s*(.+)$/);
    if (m) { map.set(WB.fold(m[1]), WB.normOwner(m[2])); continue; }
    m = l.match(/^([A-Za-zÄÖÜ]{2,4})\s*:\s*(.+)$/);
    if (m) names[m[1].toUpperCase()] = m[2].trim();
  }
  return { map, names };
}
function recompute() {
  const entries = [];
  let n = 0;
  const hidden = entryFilter();
  for (const src of S.sources) {
    if (src.enabled === false) continue;
    for (const e of src.entries) {
      const catId = src.perRow ? (e.catId || src.catId) : src.catId;
      if (hidden(catId, e.group)) continue;
      entries.push({ ...e, catId, uid: ++n, sourceId: src.id,
        sourceLabel: (src.kind === 'db' ? 'Cevi DB: ' : '') + src.label, origin: src.kind === 'db' ? 'db' : src.kind === 'manual' ? 'manual' : 'excel' });
    }
  }
  const cats = S.cats;
  const auto = S.autoAliases ? WB.deriveAliases(entries, cats) : { codeNames: {}, labelToCode: {} };
  // 1) automatisch erkannte Kürzel (aus Cevi Schweiz), 2) erfasste Personen haben Vorrang
  const aliases = new Map(Object.entries(auto.labelToCode));
  const codeNames = {};
  for (const [code, name] of Object.entries(auto.codeNames)) { aliases.set(WB.fold(code), code); codeNames[code] = name; }
  const firstCount = new Map();
  for (const st of S.staff) { const f = WB.fold((st.name || '').split(' ')[0]); if (f) firstCount.set(f, (firstCount.get(f) || 0) + 1); }
  for (const st of S.staff) {
    const k = staffKey(st); if (!k) continue;
    if (st.code) aliases.set(WB.fold(st.code), k);
    if (st.name) { aliases.set(WB.fold(st.name), k); const f = WB.fold(st.name.split(' ')[0]); if (firstCount.get(f) === 1 && !(st.name.split(' ').length === 1 && st.code)) aliases.set(f, k); }
    for (const a of st.aliases || []) aliases.set(WB.fold(a), k);
    codeNames[k] = st.name || '';
  }
  const { people, review } = WB.buildPeople(entries, { cats, order: S.order, aliases, codeNames, decisions: S.decisions, overrides: S.overrides });
  const byOwner = new Map(), coByOwner = new Map(), hiddenByOwner = new Map();
  for (const p of people) {
    p.done = S.done[p.key] !== undefined ? S.done[p.key] : !!p.doneFromFile; // „Erledigt" aus Excel wird immer übernommen
    p.hidden = !!(S.hidden && S.hidden[p.key]); // ausgeblendet: kein Versand, keine Etikette, kein Export
    const o = p.owner || '';
    if (p.hidden) { if (!hiddenByOwner.has(o)) hiddenByOwner.set(o, []); hiddenByOwner.get(o).push(p); continue; }
    if (!byOwner.has(o)) byOwner.set(o, []);
    byOwner.get(o).push(p);
    for (const c of p.coSigners) { if (!coByOwner.has(c.owner)) coByOwner.set(c.owner, []); coByOwner.get(c.owner).push({ p, via: c.via }); }
  }
  R = { people, review, entries, aliases: { codeNames, labelToCode: Object.fromEntries(aliases), auto }, byOwner, coByOwner, hiddenByOwner, active: people.filter(p => !p.hidden) };
}
const catName = (id) => (S.cats.find(c => c.id === id) || {}).name || 'ohne Kategorie';
function ownerName(o) { if (!o) return 'Ohne Zuständigkeit'; const n = R.aliases.codeNames[o]; return n ? n : o; }
function ownerHtml(o, withCode = true) {
  if (!o) return '<span class="muted">– offen –</span>';
  const n = R.aliases.codeNames[o];
  return n && n !== o ? `${withCode ? `<span class="code">${esc(o)}</span> ` : ''}${esc(n)}` : esc(o);
}
const isStaff = (k) => S.staff.some(st => staffKey(st) === k);
// Untergruppen (z.B. Fachgruppen › Informatik)
const SUB_DEFAULT_OPEN = ['fachgruppen', 'projektgruppen'];
function subgroupsOf(c) {
  const m = new Map();
  for (const e of R.entries) {
    if (e.catId !== c.id) continue;
    if (WB.key(e.group) === WB.key(c.name)) continue; // Blatt/Gruppe heisst wie die Kategorie → keine Untergruppe
    const gk = WB.groupKey(c.name, e.group); if (!gk) continue;
    let g = m.get(gk);
    if (!g) { g = { gk, name: (c.groups && c.groups[gk] && c.groups[gk].name) || e.group, count: 0, codes: new Map() }; m.set(gk, g); }
    g.count++;
    const o = e.owner ? resolveOwner(e.owner) : ''; if (o) g.codes.set(o, (g.codes.get(o) || 0) + 1);
  }
  for (const [gk, sg] of Object.entries(c.groups || {})) if (!m.has(gk) && !grpHidden(c, gk) && (sg.manual || sg.fromDb || (sg.persons || []).length)) m.set(gk, { gk, name: sg.name || gk, count: 0, codes: new Map(), manual: !!sg.manual, fromDb: sg.fromDb });
  for (const g of m.values()) { const sg = (c.groups || {})[g.gk] || {}; g.depth = sg.depth || 0; g.order = sg.order; g.parentGk = sg.parentGk || ''; }
  // Baum-Reihenfolge (Obergruppe vor ihren Untergruppen); Gruppen ohne Baum alphabetisch dahinter
  return [...m.values()].sort((a, b) => ((a.order ?? 1e6) - (b.order ?? 1e6)) || a.name.localeCompare(b.name, 'de'));
}
const showSubs = (c) => SUB_DEFAULT_OPEN.includes(c.id) || subgroupsOf(c).length >= 2 || Object.keys(c.groups || {}).length > 0;
function syncSubgroups(c, rootIds, nodes) {
  const t = WB.subgroupTree(c.name, rootIds, nodes);
  c.groups = c.groups || {};
  for (const x of t.subs) {
    const g = c.groups[x.gk] || (c.groups[x.gk] = { name: x.name, persons: [] });
    Object.assign(g, { name: g.name || x.name, fromDb: x.id, parentGk: x.parentGk, depth: x.depth, order: x.order });
  }
  return t.nameOf;
}
/** Erbt eine Untergruppe ohne eigene Zuständige von einer Obergruppe? → { gk, name, keys } */
function inheritedFrom(c, gk) {
  let cur = c.groups && c.groups[gk] && c.groups[gk].parentGk, guard = 0;
  while (cur && guard++ < 15) { const k = grpKeys(c, cur); if (k.length) return { gk: cur, name: (c.groups[cur] || {}).name || cur, keys: k }; cur = c.groups[cur] && c.groups[cur].parentGk; }
  return null;
}
function grpKeys(c, gk) { return [...new Set(WB.groupPersonLabels(c, gk).map(l => resolveOwner(l)).filter(Boolean))]; }
function setGrp(c, gk, name, persons) {
  c.groups = c.groups || {};
  const g = c.groups[gk] || (c.groups[gk] = { name: name || gk, persons: [] });
  if (!g.name && name) g.name = name;
  g.persons = persons;
}
const subRef = (v) => { const [cid, gk] = String(v || '').split('|'); return { c: S.cats.find(x => x.id === cid), gk }; };
function subLabel(c, gk) { const g = subgroupsOf(c).find(x => x.gk === gk); return c.name + ' › ' + ((g && g.name) || (c.groups && c.groups[gk] && c.groups[gk].name) || gk); }
function catKeys(c) { return [...new Set(WB.catPersonLabels(c).map(l => resolveOwner(l)).filter(Boolean))]; }
function allOwners() {
  const set = new Set([...S.staff.map(staffKey), ...R.byOwner.keys(), ...R.coByOwner.keys()].filter(Boolean));
  for (const c of S.cats) for (const k of catKeys(c)) set.add(k);
  for (const k of Object.keys(R.aliases.codeNames)) set.add(k);
  return [...set].sort((a, b) => ownerName(a).localeCompare(ownerName(b), 'de'));
}

// ---------------------------------------------------------------- Rendering
let rendering = false, renderAgain = false;
function render() {
  // Schutz: Beim Ersetzen des Inhalts kann ein Feld noch ein „change" auslösen → danach erneut zeichnen
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; setTimeout(render, 0); }
}
function renderNow() {
  if (S.ui.tab === 'dups') S.ui.tab = 'assign'; // früherer Reiter „Duplikate" ist jetzt Teil von „Unvollständig"
  if (S.ui.tab === 'all') { S.ui.tab = 'owners'; S.ui.owner = '__all'; } // Masterliste ist jetzt in „Pro Zuständige*r"
  recompute();
  renderKpis();
  renderTabs();
  const t = S.ui.tab;
  const main = $('#main');
  if (!S.sources.length && t !== 'db' && t !== 'settings' && t !== 'cats') { main.innerHTML = emptyView(); bindDrop($('#bigdrop')); return; }
  NEW_KEYS = new Set(((S.lastChange && S.lastChange.added) || []).map(a => a.k + '#' + a.zip));
  const top = '';
  if (t === 'owners') main.innerHTML = top + ownersView();
  else if (t === 'assign') main.innerHTML = assignView();
  else if (t === 'settings') main.innerHTML = top + settingsView();
  else if (t === 'cats') main.innerHTML = catsView();
  else if (t === 'db') main.innerHTML = top + dbView();
  const big = $('#bigdrop'); if (big) bindDrop(big);
  if (!$('#subline').dataset.db) $('#subline').textContent = S.sources.length
    ? `${S.sources.filter(s => s.kind === 'excel').length} Excel-Listen` + (S.sources.some(s => s.kind === 'db') ? ` · ${S.sources.filter(s => s.kind === 'db').length} Cevi-DB-Quellen (Stand ${fmtDate(S.db.lastRefresh)})` : '')
    : 'Adressen zusammenführen · Duplikate erkennen · Zuständigkeiten verteilen';
  if (typeof Cloud !== 'undefined') Cloud.badge();
}
let NEW_KEYS = new Set();
const isNew = (p) => NEW_KEYS.has(diffKey(p) + '#' + WB.key(p.zip));
function renderKpis() {
  const P = R.active, nHidden = R.people.length - P.length;

      ${sorted.map(item).join('')}

        <div class="hd">

          <div class="right noprint" style="display:flex;gap:6px">

            <button class="btn small" data-action="export-owner">⇩ Nur diese Liste</button>
          </div>
        </div>
        ${!sel ? `<div class="bd"><div class="callout warn">Diese Empfänger haben weder in der Liste noch in der Kategorie eine Zuständigkeit. Im Tab <a href="#" data-tab="assign">Unvollständig</a> frei eine Person eintragen – oder im Tab <a href="#" data-tab="cats">Kategorien</a> eine Zuständigkeit pro Kategorie setzen.</div></div>` : ''}
        ${send.length ? `<div class="tablewrap"><table>

function filteredPeople() {
  const f = S.ui.filter, q = WB.fold(f.q || '');
  return R.people.filter(p => {
    if (f.cat && !p.memberships.some(m => m.catId === f.cat)) return false;
    if (f.owner === '__none' && p.owner) return false;
    if (f.owner && f.owner !== '__none' && p.owner !== f.owner && !p.coSigners.some(c => c.owner === f.owner)) return false;
    if (f.only === 'dup' && !p.isDuplicate) return false;
    if (f.only === 'open' && p.done) return false;
    if (f.only === 'notes' && !p.notes.length) return false;
    if (f.only === 'hidden' && !p.hidden) return false;
    if (q) {
      const hay = WB.fold([p.displayName, p.org, p.email, p.street, p.zip, p.town, ...p.memberships.map(m => m.cat + ' ' + m.group)].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}
function allView() {
  const f = S.ui.filter;
  const list = filteredPeople();
  const usedCats = S.order.filter(id => R.people.some(p => p.memberships.some(m => m.catId === id)));
  return `<div class="panel">

      <select id="fonly"><option value="">Alle</option><option value="dup" ${f.only === 'dup' ? 'selected' : ''}>Nur mehrfach gelistete</option><option value="open" ${f.only === 'open' ? 'selected' : ''}>Nur nicht erledigte</option><option value="notes" ${f.only === 'notes' ? 'selected' : ''}>Nur mit Hinweisen ⚠</option><option value="hidden" ${f.only === 'hidden' ? 'selected' : ''}>Nur ausgeblendete</option></select>

      <tbody>${list.slice(0, 600).map(p => personRow(p, { showOwner: true })).join('')}</tbody>
    </table>${list.length > 600 ? `<div class="empty">… ${list.length - 600} weitere – bitte Filter verwenden.</div>` : ''}${!list.length ? '<div class="empty">Keine Treffer.</div>' : ''}</div>
  </div>`;

// ---------------------------------------------------------------- Zuteilen
const needsChoice = (p) => p.isDuplicate && p.candidates.filter(c => !c.self).length > 1;
const noOwnerAuto = (p) => !p.suggested;
function openDecisions() { return R.active.filter(p => !p.overridden && (needsChoice(p) || noOwnerAuto(p))); }
function resolveOwner(input) {
  const v = String(input || '').trim();
  if (!v) return '';
  const f = WB.fold(v);
  for (const [code, name] of Object.entries(R.aliases.codeNames)) if (WB.fold(name) === f || code.toLowerCase() === f) return code;
  if (R.aliases.labelToCode[f]) return R.aliases.labelToCode[f];
  const byFirst = Object.entries(R.aliases.codeNames).filter(([, name]) => WB.fold(name.split(' ')[0]) === f);
  if (byFirst.length === 1) return byFirst[0][0];
  return WB.normOwner(v);
}
function ownerDatalist() {
  return `<datalist id="ownerList">${allOwners().map(o => `<option value="${esc(o)}">${esc(R.aliases.codeNames[o] || '')}</option>`).join('')}</datalist>`;
}
function candButtons(p) {
  const list = p.candidates.slice();
  if (p.owner && !list.some(c => c.owner === p.owner)) list.push({ owner: p.owner, via: ['frei zugewiesen'], self: false });
  return `<div class="cands">${list.map(c => `<button class="cand ${c.owner === p.owner ? 'on' : ''} ${c.self ? 'self' : ''}" data-assign-key="${esc(p.key)}" data-assign-val="${esc(c.owner)}" title="${c.self ? 'Das ist die Person selbst' : 'Als Hauptverantwortung wählen'}">
      <div class="who">${ownerHtml(c.owner)}${c.owner === p.suggested && !p.overridden ? ' <span class="sug">Vorschlag</span>' : ''}</div>
      <div class="via">${c.self ? 'ist die Person selbst' : c.via.map(esc).join('<br>')}</div></button>`).join('')}</div>`;
}
function freeAssign(p, kind) {
  return `<div class="free"><input list="ownerList" data-free="${esc(p.key)}" placeholder="${kind === 'none' ? 'Zuständige Person: Kürzel oder Name' : 'oder andere Person: Kürzel oder Name'}"><button class="btn small" data-free-btn="${esc(p.key)}">Zuweisen</button>${p.overridden ? `<button class="btn small ghost" data-unassign="${esc(p.key)}" title="Zurück zum automatischen Vorschlag">↺ zurücksetzen</button>` : ''}</div>`;
}
function statusCell(p) {
  if (p.overridden) return '<span class="badge ok">✓ festgelegt</span>';
  if (!p.owner) return '<span class="badge bad">offen</span>';
  return '<span class="badge info">Vorschlag</span>';
}
function assignView() {
  const f = S.ui.assignFilter || 'open';
  const without = R.active.filter(noOwnerAuto);
  const dups = R.active.filter(p => p.isDuplicate && !noOwnerAuto(p));
  const decided = dups.filter(p => p.overridden || !needsChoice(p)).length;
  const showDup = dups.filter(p => f === 'all' ? true : f === 'done' ? (p.overridden || !needsChoice(p)) : (!p.overridden && needsChoice(p)));
  const showWithout = without.filter(p => f === 'all' ? true : f === 'done' ? p.overridden : !p.overridden);
  const nOpen = openCount();
  const row = (p, kind) => `<tr class="${p.overridden ? 'decided' : ''}">
      <td style="min-width:190px"><div class="name">${esc(p.displayName)}</div>${p.org && p.org !== p.displayName ? `<div class="org">${esc(p.org)}</div>` : ''}<div class="org">${esc([p.zip, p.town].filter(Boolean).join(' '))}</div>
        <div style="margin-top:4px">${statusCell(p)}</div></td>
      <td>${kind === 'dup' ? candButtons(p) : `<div class="small">${p.memberships.map(m => esc(listLabel(m))).join('<br>')}</div>${p.owner ? `<div style="margin-top:6px">zuständig: <b>${ownerHtml(p.owner)}</b></div>` : ''}`}
        ${freeAssign(p, kind)}</td>
      <td style="min-width:150px">${p.owner ? coChips(p) : '<span class="muted small">–</span>'}</td></tr>`;
  return `${ownerDatalist()}
  <div class="panel noprint" style="margin-bottom:16px"><div class="bd" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div class="seg">${[['open', 'Noch zu entscheiden'], ['done', 'Erledigt'], ['all', 'Alle']].map(([k, l]) => `<button data-afilter="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <span class="muted small">${nOpen ? `<b>${nOpen} offen</b> · ` : '<b>Alles geklärt ✓</b> · '}Hier landet alles, was noch eine Entscheidung braucht: mögliche Duplikate, Adressen ohne Zuständigkeit und Personen in mehreren Listen.</span>
    <span class="right" style="display:flex;gap:6px"><button class="btn small" data-action="accept-all" title="Alle noch offenen Doppelten mit dem Vorschlag festlegen">✓ Restliche Vorschläge übernehmen</button><button class="btn small" data-action="export-assign">⇩ Liste als Excel</button><button class="btn small" data-action="print">⎙ Drucken</button></span>
  </div></div>
  ${(S.db.pendingGroups || []).length ? `<div class="callout warn" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>🆕 ${S.db.pendingGroups.length} neue Gruppe${S.db.pendingGroups.length === 1 ? '' : 'n'} in der Cevi DB</b><span>${S.db.pendingGroups.map(p => esc(p.name)).join(', ')} – noch keiner Kategorie zugeordnet.</span><button class="btn small primary right" data-action="ng-open">Jetzt zuordnen</button></div>` : ''}
  ${reviewPanel()}
  <div class="section-title"><h3>2 · Ohne Zuständigkeit</h3><span class="muted small">${without.filter(p => p.overridden).length} von ${without.length} zugewiesen – Person frei eintragen (auch jemand, der in keiner Liste steht)</span></div>
  <div class="panel">
    ${showWithout.length ? `<div class="tablewrap"><table><thead><tr><th>Empfänger*in</th><th>Gefunden in · zuständig</th><th>Unterschreiben auch</th></tr></thead><tbody>${showWithout.map(p => row(p, 'none')).join('')}</tbody></table></div>` : `<div class="empty">${without.length ? 'Alle zugewiesen ✓' : 'Keine.'}</div>`}
  </div>

function staffFromData(label) {
  // Vorname aus „Cevi Schweiz" (Vorstand/Geschäftsstelle) → Kürzel + voller Name vorschlagen
  const f = WB.fold(label);
  const hits = new Map();
  for (const e of R.entries) if (e.catId === 'cevi-schweiz' && e.first && e.last && WB.fold(e.first.split(' ')[0]) === f) hits.set(WB.key(e.first + e.last), e);
  if (hits.size !== 1) return null;
  const e = [...hits.values()][0];
  return { code: WB.makeCode(e.first, e.last), name: e.first.split(' ')[0] + ' ' + e.last };
}
function staffUsage() {
  const m = new Map();
  for (const [o, list] of R.byOwner) m.set(o, { send: list.length, co: 0 });
  for (const [o, list] of R.coByOwner) { const x = m.get(o) || { send: 0, co: 0 }; x.co = list.length; m.set(o, x); }
  return m;
}
function staffSuggestions() {
  const known = new Set(S.staff.map(staffKey));
  const usage = staffUsage();
  const out = new Map();
  const add = (label, code, name) => {
    if (!label || known.has(label) || out.has(label) || (S.ignoredSugg || []).includes(label)) return;
    if (code && S.staff.some(st => st.code === code)) return;
    const u = usage.get(label) || { send: 0, co: 0 };
    out.set(label, { label, code, name, send: u.send, co: u.co });
  };
  const labels = new Set([...R.byOwner.keys(), ...R.coByOwner.keys()].filter(Boolean));
  for (const c of S.cats) { for (const k of catKeys(c)) labels.add(k); for (const gk of Object.keys(c.groups || {})) for (const k of grpKeys(c, gk)) labels.add(k); }
  for (const code of Object.keys((R.aliases.auto || {}).codeNames || {})) labels.add(code);
  for (const l of labels) {
    if (/^[A-ZÄÖÜ]{2,4}$/.test(l)) add(l, l, (R.aliases.auto.codeNames || {})[l] || '');
    else { const m = staffFromData(l); add(l, m ? m.code : '', m ? m.name : l); }
  }
  return [...out.values()].sort((x, y) => (y.send + y.co) - (x.send + x.co) || x.label.localeCompare(y.label));
}

  code = String(code || '').trim().toUpperCase();
  if (first === undefined && last === undefined) ({ first, last } = splitName(name));
  first = String(first || '').trim(); last = String(last || '').trim(); name = fullName(first, last);
  if (!code && !name) return null;
  if (code && S.staff.some(st => st.code === code)) { toast(`Kürzel ${code} ist schon erfasst.`); return null; }
  if (!code) code = autoCode(first, last);
  const st = { id: uid(), code, first, last, name, aliases: alias && alias !== code && alias !== name ? [alias] : [] };
  S.staff.push(st);

}
function renameKey(oldKey, newKey) {
  if (!oldKey || !newKey || oldKey === newKey) return;
  for (const c of S.cats) {
    if (Array.isArray(c.persons)) c.persons = c.persons.map(l => (l === oldKey ? newKey : l));
    for (const g of Object.values(c.groups || {})) if (Array.isArray(g.persons)) g.persons = g.persons.map(l => (l === oldKey ? newKey : l));
  }
  for (const [k, v] of Object.entries(S.overrides)) if (v === oldKey) S.overrides[k] = newKey;

function parsePersonInput(txt) {
  const t = String(txt || '').trim();
  const m = t.match(/^([A-Za-zÄÖÜ]{2,4})(?:\s*[:\-–]\s*|\s+)(.+)$/);

  return { missing, stat, body };
}

function manualAdd() {
  const v = (k) => String(MF[k] || '').trim();
  if (!v('first') && !v('last')) return toast('Bitte Vor- oder Nachname eintragen.');
  if (!v('street') || !v('zip') || !v('town')) return toast('Bitte Strasse, PLZ und Ort eintragen – sonst kann keine Karte verschickt werden.');
  if (!MF.cat) return toast('Bitte eine Kategorie wählen.');
  if (!MF.owner) return toast('Bitte wählen, wer zuständig ist.');
  let c;
  if (MF.cat === '__new') {
    const name = v('catNew'); if (!name) return toast('Bitte einen Namen für die neue Kategorie eintragen.');
    c = S.cats.find(x => WB.fold(x.name) === WB.fold(name));
    if (!c) { c = { id: 'cat-' + uid(), name, source: '', persons: [], personsManual: true, info: '', exact: [], strong: [WB.fold(name)], weak: [], custom: true }; S.cats.push(c); S.order.push(c.id); }
  } else c = S.cats.find(x => x.id === MF.cat);
  if (!c) return toast('Bitte eine Kategorie wählen.');
  let group = '';
  if (MF.sub === '__new') {
    const name = v('subNew'); if (!name) return toast('Bitte einen Namen für die neue Untergruppe eintragen.');
    const gk = WB.groupKey(c.name, name); if (!gk) return toast('Bitte einen anderen Namen für die Untergruppe wählen.');
    if (!(c.groups && c.groups[gk])) { setGrp(c, gk, name, []); c.groups[gk].manual = true; }
    group = c.groups[gk].name || name;
  } else if (MF.sub) { const g = subgroupsOf(c).find(x => x.gk === MF.sub); group = g ? g.name : ''; }
  let street = v('street'), nr = ''; const m = street.match(/^(.*\D)\s+(\d+\s?[a-zA-Z]?)$/); if (m) { street = m[1].trim(); nr = m[2]; }
  const src = manualSource();
  src.entries.push({ mid: uid(), org: '', first: v('first'), last: v('last'), nick: '', email: '', street, nr, careOf: '', zip: v('zip'), town: v('town'), country: '',
    owner: MF.owner, fixedOwner: true, extra: '', done: false, group, catId: c.id, rowNo: src.entries.length + 1, createdAt: new Date().toISOString() });
  const who = [v('first'), v('last')].filter(Boolean).join(' ');
  // Kategorie, Untergruppe und Zuständig bleiben für die nächste Person stehen
  Object.assign(MF, { first: '', last: '', street: '', zip: '', town: '', catNew: '', subNew: '', cat: c.id, sub: group ? WB.groupKey(c.name, group) : '' });
  save(); render();
  toast(`${who} angelegt – ${c.name}${group ? ' › ' + group : ''}, zuständig: ${ownerName(MF.owner)}`);
  const f = document.querySelector('[data-mf="first"]'); if (f) f.focus();
}
function manualDelete(mid) {
  const src = S.sources.find(x => x.id === 'manual'); if (!src) return;
  const e = src.entries.find(x => x.mid === mid); if (!e) return;
  if (!confirm(`${[e.first, e.last].filter(Boolean).join(' ')} wieder löschen?`)) return;
  src.entries = src.entries.filter(x => x.mid !== mid);
  if (!src.entries.length) S.sources = S.sources.filter(x => x.id !== 'manual');
  save(); render();
}

  for (const b of rest) { const c = (idx.get(b.k) || []).find(i => !used.has(i)); if (c !== undefined) { used.add(c); pairs.push([b, after[c]]); } else removed.push(b); }

    const gone = b.lists.filter(x => !a.lists.includes(x)), neu = a.lists.filter(x => !b.lists.includes(x));

// Eine neue Version ersetzt die alte: gleicher Dateiname ODER gleiche Blattnamen (z.B. 2025 → 2026).
const GENERIC_SHEET = /^\s*((tabelle|sheet|blatt|feuil|foglio)\s*\d*|export|personen|people|daten|data|liste)\s*$/i;
async function importFiles(files) {
  const notesNow = [];
  const before = S.sources.length ? snapshotPeople() : null;
  const prev = { sources: S.sources.slice(), cats: S.cats.map(c => ({ ...c })), order: S.order.slice(), lastChange: S.lastChange || null };
  const lists = { replaced: 0, removed: [] };
  const msgs = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      // CSV/Text: Umlaute richtig lesen (UTF-8, sonst Windows-Zeichensatz wie bei Excel-CSV)
      let wb;
      if (/\.(csv|tsv|txt)$/i.test(f.name)) {
        let text; try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
        wb = XLSX.read(text.replace(/^\uFEFF/, ''), { type: 'string', cellDates: false });
      } else wb = XLSX.read(buf, { type: 'array', cellDates: false });
      const sheets = wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }) }));
      const res = WB.parseWorkbookRows(sheets, f.name, S.cats, { knownFirst: R.entries.map(e => String(e.first || '').split(' ')[0]).filter(Boolean) });
      if (res.overview) {
        const updated = WB.applyOverview(S.cats, res.overview);
        S.cats = updated;
        // Reihenfolge wie im Überblick
        const ovOrder = res.overview.map(o => o.catId).filter(Boolean);
        S.order = [...new Set([...ovOrder, ...S.order])];
      }
      // Alte Versionen derselben Listen entfernen
      const newSheets = new Set(res.sources.map(x => WB.fold(x.sheet)));
      const oldExcel = S.sources.filter(o => o.kind === 'excel');
      const hit = (o) => o.file === f.name || (!GENERIC_SHEET.test(o.sheet) && newSheets.has(WB.fold(o.sheet)));
      const remove = new Set(oldExcel.filter(hit).map(o => o.id));
      let replacedHere = remove.size;
      // Liefert die neue Datei mindestens die Hälfte der Blätter einer alten Datei, gilt sie als deren neue Version:
      // dann verschwinden auch Blätter/Blöcke, die es in der neuen Version nicht mehr gibt.
      for (const F of new Set(oldExcel.filter(hit).map(o => o.file))) {
        const all = oldExcel.filter(o => o.file === F);
        const sheetsAll = new Set(all.map(o => WB.fold(o.sheet))), sheetsHit = new Set(all.filter(hit).map(o => WB.fold(o.sheet)));
        if (F === f.name || sheetsHit.size * 2 >= sheetsAll.size) for (const o of all) if (!remove.has(o.id)) { remove.add(o.id); lists.removed.push(o.label); }
      }
      lists.replaced += replacedHere;
      S.sources = S.sources.filter(o => !remove.has(o.id));
      const now = new Date().toISOString();
      // Heisst das Blatt wie eine bestehende Untergruppe der Kategorie (z.B. „Anlässe des Jahres" in „Diverse"), gehören die Einträge dorthin
      for (const src of res.sources) {
        const c = S.cats.find(x => x.id === src.catId), gk = c && src.sheet ? WB.groupKey(c.name, src.sheet) : '';
        const g = gk && c.groups && c.groups[gk];
        if (g && !g.removed) { src.group = g.name; for (const e of src.entries) e.group = g.name; }
      }
      for (const src of res.sources) S.sources.push({ ...src, importedAt: now, enabled: true });
      notesNow.push(...res.notes);
      const n = res.sources.reduce((a, x) => a + x.entries.length, 0);
      msgs.push(`${f.name}: ${res.sources.length} Listen, ${n} Einträge${res.overview ? ', Überblick übernommen' : ''}${replacedHere ? `, ${replacedHere} alte Listen ersetzt` : ''}${remove.size > replacedHere ? `, ${remove.size - replacedHere} entfernt` : ''}`);
    } catch (e) {
      console.error(e);
      msgs.push(`${f.name}: konnte nicht gelesen werden (${e.message})`);
    }
  }

  else { S.lastChange = null; UNDO = null; if (S.staff.length < 3) S.ui.tab = 'settings'; }

  setTimeout(() => { if (Date.now() - IMPORT_NOTES.at >= NOTE_MS - 50) { IMPORT_NOTES.list = []; document.querySelectorAll('.notes-fade').forEach(el => el.remove()); } }, NOTE_MS);
  save(); render(); toast(msgs.join('\n') + (S.lastChange ? '\n' + changeSummary() : ''));
}

  if (t !== undefined) S.m365.tenantId = t; if (c !== undefined) S.m365.clientId = c; if (s2 !== undefined) S.m365.siteUrl = s2;
  save(true);
}
$('#btnCloud').addEventListener('click', () => Cloud.syncNow());
function setDataMenu(open) { $('#dataMenu').hidden = !open; $('#btnMenu').setAttribute('aria-expanded', String(open)); $('#btnMenu').classList.toggle('on', open); }
$('#btnMenu').addEventListener('click', (e) => { e.stopPropagation(); setDataMenu($('#dataMenu').hidden); });
document.addEventListener('click', (e) => {
  if ($('#dataMenu').hidden) return;
  if (e.target.closest('#dataMenu button.mi') || !e.target.closest('#dataMenu')) setDataMenu(false); // Aktion gewählt oder daneben geklickt
});
$('#labelModal').addEventListener('click', (e) => { if (e.target.id === 'labelModal') $('#labelModal').hidden = true; });
$('#cloudModal').addEventListener('click', (e) => { if (e.target.id === 'cloudModal') $('#cloudModal').hidden = true; });
$('#ngModal').addEventListener('click', (e) => { if (e.target.id === 'ngModal') { NG_LATER = true; $('#ngModal').hidden = true; } });
$('#catModal').addEventListener('click', (e) => { if (e.target.id === 'catModal') closeCatDialog(true); });
$('#fileInput').addEventListener('change', (e) => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); });
let dragN = 0;
window.addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('#dropmask').classList.add('show'); } });
window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#dropmask').classList.remove('show'); });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); dragN = 0; $('#dropmask').classList.remove('show'); const f = [...(e.dataTransfer?.files || [])]; if (f.length) importFiles(f); });
if (S.db.rememberToken) sessionToken = S.db.token;
if (S.importDone === false) { try { recompute(); for (const p of R.people) if (p.doneFromFile && S.done[p.key] === undefined) S.done[p.key] = false; } catch (e) { console.warn(e); } S.importDone = true; save(true); }
if (S._pruneV6) { delete S._pruneV6; try { pathFilterPrune(); } catch (e) { console.warn(e); } save(true); }
render();
detectProxy();
Cloud.start();
</script>
